name: Build Android APK & Publish Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-apk:
    name: Build APK & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Node.js Dependencies
        run: |
          if [ -f package-lock.json ]; then
            npm install || npm ci
          else
            npm install
          fi

      - name: Build Web Application & Bundle Android Assets
        run: npm run build:android

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant Execute Permission to Gradle Wrapper
        run: chmod +x ./android/gradlew

      - name: Build Android Debug APK
        working-directory: ./android
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Android Release APK
        working-directory: ./android
        run: ./gradlew assembleRelease --stacktrace

      - name: Prepare APK Artifacts for Distribution
        run: |
          mkdir -p release-apks
          # Find and copy generated APKs
          find android/app/build/outputs/apk -name "*.apk" -type f -exec cp {} release-apks/ \;
          # Also ensure friendly primary naming for the debug/installable build
          if [ -f "./android/app/build/outputs/apk/debug/app-debug.apk" ]; then
            cp ./android/app/build/outputs/apk/debug/app-debug.apk ./release-apks/Mahara-EduTok-v1.0.apk
          fi
          ls -la release-apks/

      - name: Upload APKs as Workflow Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: mahara-android-apk
          path: release-apks/*.apk
          retention-days: 30

      - name: Create GitHub Release & Upload APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: ${{ format('Mahara (مهارة) Android App v1.0.{0}', github.run_number) }}
          draft: false
          prerelease: false
          files: release-apks/*.apk
          body: |
            ## 📱 تطبيق مهارة التعليمي لأجهزة أندرويد (APK)
            
            تم بناء حزمة تطبيق أندرويد المستقلة بالكامل بنجاح.
            
            ### 📥 التنزيل والتثبيت المباشر:
            - قم بتنزيل ملف **`Mahara-EduTok-v1.0.apk`** من المرفقات أدناه.
            - اضغط على الملف في هاتفك ووافق على التثبيت (Install from Unknown Sources إذا طُلب ذلك).
            - استمتع بتجربة تعلم المهارات السريعة، الاختبارات التفاعلية، والمساعد الذكي بدون الحاجة لفتح المتصفح أو أي خوادم خارجية!
            
            ### ✨ مميزات النسخة:
            - 🚀 تطبيق مستقل تماماً يعمل أوفلاين وأونلاين.
            - 📱 دعم الشاشة الكاملة (Edge-to-Edge / Immersive Mode).
            - 🎯 اختبارات مهارية تفاعلية + تدريبات Sandbox عملية.
            - 🤖 معلم مهارة الذكي التفاعلي مع دعم النطق الصوتي.
            - 💼 محفظة تعليمية وتتبع تقدم XP وشهادات إنجاز.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
